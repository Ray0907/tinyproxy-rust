name: Pinned proxy benchmark
on:
  push:
    branches: [bench/http2-e2e]
    paths: [benchmarks/e2e/**, .github/workflows/benchmark-e2e.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinned-proxy-benchmark
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Ray0907/tinyproxy-rust
          ref: d500d2510475daafa8269e09caea6d2043c26aa5
          path: tested-source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build pinned implementations and independent Go driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          (cd tested-source && cargo build --release --locked) >benchmark-results/rust-build.log 2>&1 || { tail -80 benchmark-results/rust-build.log; exit 1; }
          curl --fail --location --retry 3 https://github.com/tinyproxy/tinyproxy/releases/download/1.11.3/tinyproxy-1.11.3.tar.gz -o /tmp/tinyproxy.tar.gz
          echo '9bcf46db1a2375ff3e3d27a41982f1efec4706cce8899ff9f33323a8218f7592  /tmp/tinyproxy.tar.gz' | sha256sum -c -
          mkdir -p c-source
          tar xzf /tmp/tinyproxy.tar.gz -C c-source --strip-components=1
          (cd c-source && ./configure --disable-manpage-support CFLAGS='-O3 -DNDEBUG' && make -j2) >benchmark-results/c-build.log 2>&1 || { tail -80 benchmark-results/c-build.log; exit 1; }
          (cd benchmarks/e2e && go mod tidy && gofmt -w main.go && go build -trimpath -o ../../bench-driver .) >benchmark-results/go-build.log 2>&1 || { cat benchmark-results/go-build.log; exit 1; }
          cp benchmarks/e2e/go.mod benchmarks/e2e/go.sum benchmark-results/
          cp tested-source/Cargo.lock benchmark-results/
          git rev-parse HEAD > benchmark-results/harness-commit.txt
          git -C tested-source rev-parse HEAD > benchmark-results/tested-commit.txt
          sha256sum tested-source/target/release/tinyproxy-rust c-source/src/tinyproxy bench-driver > benchmark-results/binary-sha256.txt
      - name: Re-run regression suite and real curl interoperability
        shell: bash
        run: |
          set -euo pipefail
          (cd tested-source && cargo test --all-targets --locked) >benchmark-results/tests.log 2>&1 || { tail -100 benchmark-results/tests.log; exit 1; }
          grep -E '^running [0-9]+ tests|^test result:' benchmark-results/tests.log
          python3 tested-source/scripts/test_curl_proxy.py --binary tested-source/target/release/tinyproxy-rust --curl /usr/bin/curl | tee benchmark-results/curl.log
      - name: Run fixed-concurrency benchmarks and idle-tunnel measurements
        shell: bash
        run: |
          set -euo pipefail
          ulimit -n 32768
          python3 benchmarks/e2e/run.py --rust tested-source/target/release/tinyproxy-rust --c-proxy c-source/src/tinyproxy --driver ./bench-driver --output benchmark-results --rounds 3 --seconds 4 | tee benchmark-results/run.log
      - name: Retain results even when a case fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-proxy-benchmark-${{ github.run_id }}
          path: benchmark-results/
          retention-days: 30
