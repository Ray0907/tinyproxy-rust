name: Prepare HTTP2 branch
on:
  push:
    branches: [feat/http2-proxy]
    paths: [.github/workflows/prepare-http2.yml]
permissions:
  contents: write
concurrency:
  group: prepare-http2
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/feat/http2-proxy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Normalize the configuration iterator
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/config.rs')
          s = p.read_text()
          if 'for file in [' in s:
              start = s.index('        for file in [')
              end = s.index('        Ok(config)', start)
              s = s[:start] + '''        for value in [
                      &mut config.filter_file,
                      &mut config.tls_cert,
                      &mut config.tls_key,
                  ].into_iter().flatten() {
                      if Path::new(value).is_relative() {
                          *value = path.parent().unwrap_or_else(|| Path::new("."))
                              .join(&*value).to_string_lossy().into_owned();
                      }
                  }
          ''' + s[end:]
              p.write_text(s)
          PY
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/config.rs
          if ! git diff --cached --quiet; then
            git commit -m 'style: flatten optional configuration paths'
            git push origin HEAD:feat/http2-proxy
          fi
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all-targets --locked
      - run: cargo build --release --locked
      - run: python3 scripts/test_curl_proxy.py --curl /usr/bin/curl
