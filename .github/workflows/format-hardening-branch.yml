# Temporary branch-only maintenance; removed before this PR is ready.
name: Format hardening branch
on:
  push:
    branches: [fix/proxy-core-hardening]
    paths: [.github/workflows/format-hardening-branch.yml]
permissions:
  contents: write
jobs:
  format:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/proxy-core-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/proxy-core-hardening
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format only Rust sources and generate the application lockfile
        run: |
          cargo fmt --all
          cargo generate-lockfile
          git add src benches tests
          git add -f Cargo.lock
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'style: format Rust sources and pin application dependencies'
          git push origin HEAD:refs/heads/fix/proxy-core-hardening
