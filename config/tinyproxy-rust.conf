# Safe local forward-proxy configuration. This is key/value syntax, not TOML.
# Run as an unprivileged user; use a service manager instead of daemonization.
# Validate without opening sockets:
# tinyproxy-rust --check -c config/tinyproxy-rust.conf

Listen 127.0.0.1
Port 8888
MaxClients 100
LogLevel Info

# Seconds: idle I/O, total header-read deadline, DNS/TCP connection, shutdown.
Timeout 600
HeaderTimeout 30
ConnectTimeout 30
ShutdownTimeout 5

# An explicit list replaces the defaults. A lone ConnectPort 0 disables tunnels.
ConnectPort 443

# Optional local statistics (still subject to configured ACL and authentication).
# StatHost tinyproxy.stats

# Optional authentication. Replace these examples before enabling them.
# BasicAuth alice "replace-with-a-password"
# BasicAuth bob "replace-with-another-password"
# BasicAuth does not encrypt the client-to-proxy connection.

# Optional domain filtering. Relative paths resolve against this file's directory.
# Filter "blocked-domains.txt"
# FilterURLs No
# FilterExtended No
# FilterCaseSensitive No

# For a LAN listener, explicitly configure who may connect; never expose an
# unauthenticated public proxy. ACL rules are evaluated in written order.
# Listen 192.168.1.10
# Allow 192.168.1.0/24
# Deny all
